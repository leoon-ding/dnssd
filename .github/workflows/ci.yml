name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: stable
          - os: windows-latest
            go: stable
          - os: macos-latest
            go: stable
          - os: ubuntu-22.04
            go: '1.20.x'
    env:
      CGO_ENABLED: '1'
      GOFLAGS: '-mod=readonly'
      GOTOOLCHAIN: local
      # Hosted runners do not provide a controlled LAN multicast environment.
      DNSSD_TEST_MULTICAST: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Build all packages
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        run: go test -race ./... -shuffle=on -count=1 -timeout=120s
      - name: Check module files are unchanged
        run: git diff --exit-code -- go.mod go.sum

  ci:
    name: CI
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all matrix jobs to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
